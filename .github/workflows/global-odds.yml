name: global-odds

# Fetches sharp global prices (Pinnacle via football-data.co.uk, Smarkets exchange) from GitHub's
# servers, because these sources are not reachable from Turkey. Results are committed to
# data/global_odds/latest/ and read locally by scripts/nesine_global.py after `git pull`.

# Runs ONLY on request (user rule, 20 Nov): the AI that is asked starts it with `gh workflow run global-odds.yml`.
on:
  workflow_dispatch:
    inputs:
      light:
        description: "Light refresh window in hours (empty = full fetch)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: global-odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 24 Kas: iş 15 dk sınırında iptal oldu (fetch ~8 dk + Club Elo 7 dk takıldı) ve hiçbir veri commit edilmedi.
    # Sınır 25 dk; veri Club Elo'dan ÖNCE commit edilir, Elo ayrı ve süre sınırlı adımdır.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: pip install requests numpy
      - name: Fetch global odds
        timeout-minutes: 14
        run: |
          git pull -q --ff-only || true   # a light run merges into the newest snapshot, not the one at trigger time
          if [ -n "${{ github.event.inputs.light }}" ]; then
            python scripts/fetch_global_odds.py --light "${{ github.event.inputs.light }}"
          else
            python scripts/fetch_global_odds.py
          fi
      - name: Commit data
        timeout-minutes: 4
        run: |
          git config user.name "global-odds-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/ours && mkdir -p /tmp/ours && cp -a data/global_odds/latest/. /tmp/ours/
          for i in 1 2 3 4; do
            git add data/global_odds
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "data(global-odds): $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q && exit 0
            # Another run pushed first. Never line-merge the JSON: start from the newest data and rebuild on it.
            git fetch -q origin main && git reset -q --hard origin/main
            if [ -n "${{ github.event.inputs.light }}" ]; then
              python scripts/fetch_global_odds.py --light "${{ github.event.inputs.light }}"   # re-merge into newest
            else
              cp -a /tmp/ours/. data/global_odds/latest/   # a full fetch is a complete, newer snapshot
            fi
            sleep 3
          done
          exit 1
      - name: Club Elo ratings
        timeout-minutes: 4
        continue-on-error: true
        run: |
          python scripts/elo_gorus.py --cek || { echo "Club Elo unavailable"; exit 0; }
          git add data/global_odds/latest/clubelo.csv data/calibration/elo_1x2.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no elo changes"; exit 0; fi
          git commit -q -m "data(club-elo): $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 3; done
          echo "elo push failed (data commit already pushed)"
