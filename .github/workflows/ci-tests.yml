name: ci-tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "terminal/**"
      - "pyproject.toml"
      - ".github/workflows/ci-tests.yml"
      - ".github/copilot-instructions.md"
      - "data/calibration/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "docs/ORTAK_SISTEM.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # historical audit needs original publication commit timestamps
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest lxml
      - name: Run full test suite
        run: pytest -q
      - name: Audit all accessible AI predictions and coupons (read-only)
        run: |
          python scripts/ai_history_audit.py --out /tmp/quantfoot-ai-audit
          cat /tmp/quantfoot-ai-audit/ai_history_audit.md
      - uses: actions/upload-artifact@v4
        with:
          name: ai-history-audit
          path: /tmp/quantfoot-ai-audit/
          retention-days: 30
