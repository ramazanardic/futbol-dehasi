name: ci-tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "terminal/**"
      - "pyproject.toml"
      - ".github/workflows/ci-tests.yml"
      - ".github/copilot-instructions.md"
      - "data/calibration/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "docs/ORTAK_SISTEM.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest lxml
      - name: Run full test suite
        run: pytest -q
      - name: Verify online match research
        run: node --test tests/test_terminal_research.mjs
