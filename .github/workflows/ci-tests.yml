name: ci-tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"   # Weekly Sunday automated test & calibration sanity check
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest lxml
      - name: Run full test suite
        run: pytest -q
