name: ci-tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "terminal/**"
      - "pyproject.toml"
      - ".github/workflows/ci-tests.yml"
      - ".github/copilot-instructions.md"
      - "data/calibration/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "docs/ORTAK_SISTEM.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # historical audit needs original publication commit timestamps
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest lxml
      - name: Run full test suite
        run: pytest -q
      - name: Audit all accessible AI predictions and coupons (read-only)
        run: |
          python scripts/ai_history_audit.py --out /tmp/quantfoot-ai-audit
          cat /tmp/quantfoot-ai-audit/ai_history_audit.md
      - uses: actions/upload-artifact@v4
        with:
          name: ai-history-audit
          path: /tmp/quantfoot-ai-audit/
          retention-days: 30

  research_requested_fixtures:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/canli-23-24-kasim-derin-mac-taramasi-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      QUANTFOOT_AI: chatgbttahmin
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install research dependencies
        run: |
          pip install -e .
      - name: Refresh sharp global odds (no scheduled automation)
        continue-on-error: true
        run: |
          timeout 180 python scripts/fetch_global_odds.py --light 72
      - name: Fetch all current and next-day Nesine market and team research
        run: |
          mkdir -p /tmp/football-fixtures/source
          for day in 2026-11-23 2026-11-24; do
            echo "::group::$day: live Nesine + all team stats"
            timeout 390 python scripts/nesine_global.py --date "$day" --tum-istatistikler 2>&1 | tee "/tmp/football-fixtures/source/bulten_$day.log" || echo "Source limited/timed out; partial date is not claimed complete"
            echo "::endgroup::"
            if [ -s "tahminler/chatgbttahmin/$day/nesine_global.json" ]; then
              timeout 90 python scripts/ai_tahmin.py --tarih "$day" --hazir-bulten || true
            fi
          done
      - name: Check full historical team profiles for not-yet-started matches
        continue-on-error: true
        run: |
          for day in 2026-11-24 2026-11-23; do
            if [ -s "tahminler/chatgbttahmin/$day/nesine_global.json" ]; then
              timeout 1700 python scripts/derin_tahmin.py --tarih "$day" --aday 5 --workers 4 --tum-istatistikler \
                2>&1 | tee "/tmp/football-fixtures/source/derin_$day.log" || echo "$day: some historical profiles unavailable"
            fi
          done
      - name: Build unstarted calendar-day fixture inventory, full source-backed JSON and CSV
        if: always()
        run: |
          python scripts/fixture_window_report.py --date-from 2026-11-23 --date-to 2026-11-24 \
            --out /tmp/football-fixtures/
          cat /tmp/football-fixtures/all_upcoming_matches.md
      - name: Upload user-requested full research and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futbol-dehasi-23-24-tum-baslamamis-maclar
          path: /tmp/football-fixtures/
          retention-days: 15
