<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantFoot — Canlı Futbol İstihbarat & Öz-Öğrenme Paneli</title>
  <style>
    :root {
      --bg: #0b101b;
      --panel: #131b2c;
      --panel-2: #192338;
      --border: #25324d;
      --text: #e6edf7;
      --muted: #8fa1be;
      --accent: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --violet: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at top right, #16223a 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 16, 27, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 12px var(--green);
    }
    .brand h1 { margin: 0; font-size: 1.15rem; letter-spacing: -0.02em; }
    .brand small { color: var(--muted); display: block; font-size: 0.78rem; }
    .header-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    select, input[type="search"] {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; font-size: 0.88rem; outline: none;
    }
    select:focus, input[type="search"]:focus { border-color: var(--accent); }
    main { max-width: 1440px; margin: 0 auto; padding: 20px 20px 60px; }
    .kpis {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .kpi {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px;
    }
    .kpi .lbl { color: var(--muted); font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .kpi .val { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .kpi .sub { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab {
      background: var(--panel); border: 1px solid var(--border); color: var(--muted);
      padding: 9px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.88rem;
    }
    .tab.active { background: var(--accent); color: #06121f; border-color: var(--accent); }
    .filters {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px;
    }
    .pill {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 0.8rem;
    }
    .pill.active { background: rgba(56, 189, 248, 0.2); border-color: var(--accent); color: var(--accent); }
    .table-wrap {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(37, 50, 77, 0.7); white-space: nowrap; }
    th { background: var(--panel-2); color: var(--muted); font-weight: 600; font-size: 0.76rem; text-transform: uppercase; }
    tbody tr { cursor: pointer; transition: background 0.12s; }
    tbody tr:hover { background: rgba(56, 189, 248, 0.08); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 600;
    }
    .b-keskin { background: rgba(34, 197, 94, 0.16); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.35); }
    .b-orta { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }
    .b-dusuk { background: rgba(244, 63, 94, 0.16); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.35); }
    .b-flag { background: rgba(167, 139, 250, 0.18); color: #c4b5fd; margin-left: 4px; }
    .pick-hi { color: #4ade80; font-weight: 600; }
    .muted { color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    }
    .card h3 { margin: 0 0 10px; font-size: 1rem; }
    .bar-row { display: grid; grid-template-columns: 90px 1fr 110px; gap: 10px; align-items: center; margin: 7px 0; font-size: 0.82rem; }
    .bar-track { height: 10px; background: var(--panel-2); border-radius: 6px; position: relative; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 6px; }
    .bar-mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--amber); }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72); display: none;
      align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      max-width: 760px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px;
    }
    .modal-hdr { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .close-btn {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px; cursor: pointer;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
    @media (max-width: 680px) { .grid-2 { grid-template-columns: 1fr; } }
    .hidden { display: none !important; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <h1>QuantFoot — 7/24 Otonom Futbol İstihbarat Paneli</h1>
        <small id="metaLine">Yükleniyor...</small>
      </div>
    </div>
    <div class="header-controls">
      <select id="dateSelect" title="Tarih seç"></select>
      <a href="https://github.com/ramazanardic/futbol-dehasi" target="_blank" rel="noopener">GitHub Repo ↗</a>
    </div>
  </header>

  <main>
    <section class="kpis" id="kpiGrid"></section>

    <div class="tabs">
      <button class="tab active" data-tab="matches">Günün Maçları</button>
      <button class="tab" data-tab="coupons">Otomatik Kuponlar</button>
      <button class="tab" data-tab="learning">Öz-Öğrenme & Kalibrasyon</button>
    </div>

    <section id="tab-matches">
      <div class="filters">
        <input id="searchBox" type="search" placeholder="Takım veya lig ara..." />
        <select id="leagueSelect"><option value="">Tüm Ligler</option></select>
        <button class="pill active" data-filter="all">Tümü</button>
        <button class="pill" data-filter="keskin">Yalnız Keskin</button>
        <button class="pill" data-filter="playable">Kupona Uygun</button>
        <button class="pill" data-filter="p70">%70+ Seçim</button>
        <button class="pill" data-filter="steam">⚡ Steam</button>
        <button class="pill" data-filter="tm">🩺 Sakat/Cezalı</button>
        <button class="pill" data-filter="weather">🌧️ Hava</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Saat</th>
              <th>Lig</th>
              <th>Maç</th>
              <th>Güven / Kaynak</th>
              <th>1 / X / 2</th>
              <th>xG</th>
              <th>2.5Ü / KG</th>
              <th>En Olası Skor</th>
              <th>En Güvenilir Tercih</th>
              <th>Ev / Dep (Form · TM)</th>
            </tr>
          </thead>
          <tbody id="matchesBody"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-coupons" class="hidden">
      <div class="cards" id="couponsGrid"></div>
    </section>

    <section id="tab-learning" class="hidden">
      <div class="cards" id="learningGrid"></div>
    </section>
  </main>

  <div class="modal-bg" id="modalBg">
    <div class="modal" id="modalContent"></div>
  </div>

  <script>
    let ROOT_DATA = null;
    let CURRENT_DAY = null;
    let ACTIVE_FILTER = "all";

    const fmtPct = (v) => (v == null ? "-" : "%" + Math.round(v * 100));
    const fmtPct1 = (v) => (v == null ? "-" : "%" + (v * 100).toFixed(1));
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function tierBadge(m) {
      const cls = m.tier === "keskin" ? "b-keskin" : (m.tier === "global_buro" ? "b-orta" : "b-dusuk");
      const lbl = m.tier === "keskin" ? "KESKİN" : (m.tier === "global_buro" ? "ORTA" : "DÜŞÜK");
      const shortRef = (m.reference || "-").replace(" (football-data)", "").replace(" (borsa)", "");
      let extras = "";
      if ((m.flags || []).some((f) => f.includes("Sharp steam"))) extras += '<span class="badge b-flag">⚡</span>';
      if ((m.flags || []).some((f) => f.startsWith("TM:"))) extras += '<span class="badge b-flag">🩺</span>';
      if ((m.flags || []).some((f) => f.startsWith("Hava uyarısı:"))) extras += '<span class="badge b-flag">🌧️</span>';
      return `<span class="badge ${cls}">${lbl}</span> <span class="muted">${esc(shortRef)}</span>${extras}`;
    }

    function fmtSideBrief(sideObj) {
      if (!sideObj) return "-";
      const bits = [];
      if (sideObj.form) bits.push(sideObj.form);
      if (sideObj.rank) bits.push(sideObj.rank + (sideObj.points != null ? ` (${sideObj.points}p)` : ""));
      if (sideObj.gk1_out) bits.push("⚠GK1");
      else if (sideObj.top_scorer_out) bits.push("⚠Golcü");
      else if (sideObj.critical_n) bits.push(`${sideObj.critical_n} kilit`);
      return bits.join(" · ") || "-";
    }

    function renderKPIs() {
      const s = CURRENT_DAY.summary;
      const cal = ROOT_DATA.calibration || {};
      const ov = cal.overall || {};
      document.getElementById("metaLine").textContent =
        `Seçili gün: ${CURRENT_DAY.date} · Son analiz: ${(CURRENT_DAY.generated_at || "").slice(0, 16).replace("T", " ")} TSİ · Panel derleme: ${(ROOT_DATA.built_tsi || "").slice(0, 16).replace("T", " ")} TSİ`;
      document.getElementById("kpiGrid").innerHTML = `
        <div class="kpi"><div class="lbl">Global Fiyat Kapsamı</div><div class="val">${s.global_priced}/${s.real_matches}</div><div class="sub">%${s.global_pct} global · ${s.dusuk_guven} yalnız Nesine</div></div>
        <div class="kpi"><div class="lbl">Keskin / Orta Güven</div><div class="val">${s.keskin} / ${s.global_buro}</div><div class="sub">Pinnacle·Borsa·BetInAsia / Büro</div></div>
        <div class="kpi"><div class="lbl">Canlı Araştırma</div><div class="val">${s.researched}/${s.real_matches}</div><div class="sub">ESPN + Transfermarkt 2026/27</div></div>
        <div class="kpi"><div class="lbl">Canlı Uyarılar</div><div class="val">⚡${s.steam_alerts} · 🩺${s.tm_alerts}</div><div class="sub">Sharp steam · Kritik eksik · 🌧️${s.weather_alerts || 0}</div></div>
        <div class="kpi"><div class="lbl">Öz-Öğrenme (Brier)</div><div class="val">${ov.brier != null ? ov.brier.toFixed(4) : "-"}</div><div class="sub">${ov.n || 0} sonuçlanan seçim (${(cal.days || []).length} gün)</div></div>
      `;
    }

    function populateLeagues() {
      const sel = document.getElementById("leagueSelect");
      const cur = sel.value;
      const leagues = [...new Set(CURRENT_DAY.matches.map((m) => m.league))].sort();
      sel.innerHTML = '<option value="">Tüm Ligler (' + leagues.length + ')</option>' +
        leagues.map((l) => `<option value="${esc(l)}">${esc(l)}</option>`).join("");
      if (leagues.includes(cur)) sel.value = cur;
    }

    function renderMatches() {
      const q = document.getElementById("searchBox").value.trim().toLowerCase();
      const lg = document.getElementById("leagueSelect").value;
      const rows = CURRENT_DAY.matches.filter((m) => {
        if (lg && m.league !== lg) return false;
        if (q && !(m.home + " " + m.away + " " + m.league).toLowerCase().includes(q)) return false;
        if (ACTIVE_FILTER === "keskin" && m.tier !== "keskin") return false;
        if (ACTIVE_FILTER === "playable" && !m.best_pick) return false;
        if (ACTIVE_FILTER === "p70" && (!m.best_pick || m.best_pick.prob < 0.70)) return false;
        if (ACTIVE_FILTER === "steam" && !(m.flags || []).some((f) => f.includes("Sharp steam"))) return false;
        if (ACTIVE_FILTER === "tm" && !(m.flags || []).some((f) => f.startsWith("TM:"))) return false;
        if (ACTIVE_FILTER === "weather" && !(m.flags || []).some((f) => f.startsWith("Hava uyarısı:"))) return false;
        return true;
      });
      const body = document.getElementById("matchesBody");
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="10" class="muted" style="text-align:center;padding:24px;">Filtreye uyan maç yok.</td></tr>';
        return;
      }
      body.innerHTML = rows.map((m) => {
        const f1x2 = m.fair_1x2 ? `${fmtPct(m.fair_1x2[0])} / ${fmtPct(m.fair_1x2[1])} / ${fmtPct(m.fair_1x2[2])}` : "-";
        const xg = m.mu_home != null ? `${m.mu_home.toFixed(2)}-${m.mu_away.toFixed(2)}` : "-";
        const ouKg = `${fmtPct(m.p_o25)} / ${fmtPct(m.p_btts)}`;
        const sc = (m.top_scores || []).slice(0, 2).map((x) => `${x[0]} ${fmtPct(x[1])}`).join(", ") || "-";
        const pk = m.best_pick
          ? `<span class="pick-hi">${esc(m.best_pick.name || m.best_pick.selection)}</span> ${fmtPct(m.best_pick.prob)} @${m.best_pick.odds.toFixed(2)}`
          : `<span class="muted">${esc(m.best_pick_note || "-")}</span>`;
        const resTxt = `${fmtSideBrief(m.research?.home)} | ${fmtSideBrief(m.research?.away)}`;
        return `<tr data-code="${m.code}">
          <td>${esc((m.kickoff || "").slice(11, 16))}</td>
          <td class="muted">${esc(m.league)}</td>
          <td><strong>${esc(m.home)}</strong> - ${esc(m.away)}</td>
          <td>${tierBadge(m)}</td>
          <td>${f1x2}</td>
          <td>${xg}</td>
          <td>${ouKg}</td>
          <td class="muted">${sc}</td>
          <td>${pk}</td>
          <td class="muted">${esc(resTxt)}</td>
        </tr>`;
      }).join("");
      body.querySelectorAll("tr[data-code]").forEach((tr) => {
        tr.addEventListener("click", () => openMatchModal(Number(tr.dataset.code)));
      });
    }

    function openMatchModal(code) {
      const m = CURRENT_DAY.matches.find((x) => x.code === code);
      if (!m) return;
      const r = m.research || {};
      const dossierUrl = `https://github.com/ramazanardic/futbol-dehasi/blob/main/reports/daily/${CURRENT_DAY.date}/mac_dosyalari/${m.code}.md`;
      const flagsHtml = (m.flags || []).length
        ? `<div style="margin:10px 0;padding:10px;border-radius:8px;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.35);font-size:0.84rem;">⚠ ${m.flags.map(esc).join(" · ")}</div>`
        : "";
      const selsRows = (m.top_selections || []).map((s) =>
        `<tr><td>${esc(s.market)}</td><td><strong>${esc(s.selection)}</strong></td><td>${fmtPct1(s.prob)}</td><td>${s.odds.toFixed(2)}</td><td>${(s.ev * 100 >= 0 ? "+" : "") + (s.ev * 100).toFixed(1)}%</td><td>${s.direct ? "doğrudan" : "model"}</td></tr>`
      ).join("");
      document.getElementById("modalContent").innerHTML = `
        <div class="modal-hdr">
          <div>
            <div class="muted" style="font-size:0.8rem;">${esc(m.kickoff)} · ${esc(m.league)}</div>
            <h2 style="margin:4px 0;">${esc(m.home)} - ${esc(m.away)}</h2>
            <div>${tierBadge(m)} · xG: <strong>${m.mu_home != null ? `${m.mu_home.toFixed(2)} - ${m.mu_away.toFixed(2)}` : "-"}</strong> · <a href="${dossierUrl}" target="_blank" rel="noopener">Tam Maç Dosyası (GitHub) ↗</a></div>
          </div>
          <button class="close-btn" id="closeModalBtn">Kapat</button>
        </div>
        ${flagsHtml}
        <div class="grid-2">
          <div class="card">
            <h3>Ev: ${esc(m.home)}</h3>
            <div class="muted" style="font-size:0.83rem;line-height:1.55;">
              <div>Sıra/Puan: <strong>${esc(r.home?.rank || "-")}</strong> ${r.home?.points != null ? `(${r.home.points}p)` : ""}</div>
              <div>Form: ${esc(r.home?.form || "-")} ${r.home?.rest_days ? `· ${r.home.rest_days}g dinlenme` : ""}</div>
              <div>Golcüler: ${esc((r.home?.top_scorers || []).join(", ") || "-")}</div>
              <div>Eksikler (TM 2026/27): ${esc(r.home?.tm_brief || "-")}</div>
            </div>
          </div>
          <div class="card">
            <h3>Deplasman: ${esc(m.away)}</h3>
            <div class="muted" style="font-size:0.83rem;line-height:1.55;">
              <div>Sıra/Puan: <strong>${esc(r.away?.rank || "-")}</strong> ${r.away?.points != null ? `(${r.away.points}p)` : ""}</div>
              <div>Form: ${esc(r.away?.form || "-")} ${r.away?.rest_days ? `· ${r.away.rest_days}g dinlenme` : ""}</div>
              <div>Golcüler: ${esc((r.away?.top_scorers || []).join(", ") || "-")}</div>
              <div>Eksikler (TM 2026/27): ${esc(r.away?.tm_brief || "-")}</div>
            </div>
          </div>
        </div>
        <h3 style="margin:14px 0 8px;">En Yüksek Olasılıklı Seçimler (Nesine ≥ 1,20)</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Pazar</th><th>Seçim</th><th>Olasılık</th><th>Nesine</th><th>EV</th><th>Fiyat</th></tr></thead>
            <tbody>${selsRows || '<tr><td colspan="6" class="muted">Uygun seçim yok.</td></tr>'}</tbody>
          </table>
        </div>
      `;
      document.getElementById("modalBg").classList.add("open");
      document.getElementById("closeModalBtn").onclick = () => document.getElementById("modalBg").classList.remove("open");
    }

    function renderCoupons() {
      const box = document.getElementById("couponsGrid");
      const files = CURRENT_DAY.coupons || [];
      if (!files.length) {
        box.innerHTML = '<div class="card"><p class="muted">Bu gün için henüz kayıtlı kupon dosyası yok.</p></div>';
        return;
      }
      box.innerHTML = files.flatMap((f) =>
        (f.coupons || []).map((c, idx) => `
          <div class="card">
            <h3>${esc(f.file)} · Kupon ${idx + 1} (${c.nesine_odds}x · Tutma ${fmtPct1(c.probability)})</h3>
            <div class="muted" style="font-size:0.8rem;margin-bottom:10px;">Alt sınır: ${fmtPct1(c.probability_low ?? c.probability)} · ${c.legs.length} maç (MBS ${c.min_mbs})</div>
            ${c.legs.map((l) => `
              <div style="padding:7px 0;border-top:1px solid var(--border);font-size:0.84rem;">
                <div><strong>${esc(l.match)}</strong> — <span class="pick-hi">${esc(l.selection)}</span> @${Number(l.odds).toFixed(2)} (${fmtPct(l.p)})</div>
                <div class="muted" style="font-size:0.76rem;">${esc(l.market)} · ${esc(l.reference)} · ${l.direct ? "doğrudan" : "model"}</div>
              </div>
            `).join("")}
          </div>
        `)
      ).join("");
    }

    function renderLearning() {
      const box = document.getElementById("learningGrid");
      const cal = ROOT_DATA.calibration || {};
      if (!cal.overall || !cal.overall.n) {
        box.innerHTML = '<div class="card"><p class="muted">Henüz sonuçlanan gün verisi birikmedi.</p></div>';
        return;
      }
      const bandsHtml = Object.entries(cal.bands || {}).map(([lbl, st]) => {
        if (!st.n) return "";
        const realW = Math.min(100, Math.round((st.realized || 0) * 100));
        const predPos = Math.min(100, Math.round((st.mean_pred || 0) * 100));
        return `<div class="bar-row"><span>${lbl} (${st.n})</span><div class="bar-track"><div class="bar-fill" style="width:${realW}%"></div><div class="bar-mark" style="left:${predPos}%"></div></div><span>${fmtPct1(st.realized)} / ${fmtPct1(st.mean_pred)}</span></div>`;
      }).join("");

      const srcRows = Object.entries(cal.sources || {}).map(([k, st]) =>
        `<tr><td>${esc(k)}</td><td>${st.n}</td><td>${fmtPct1(st.mean_pred)}</td><td>${fmtPct1(st.realized)}</td><td>${st.brier?.toFixed(4) ?? "-"}</td><td>${(st.sigma_delta >= 0 ? "+" : "") + st.sigma_delta.toFixed(4)}</td></tr>`
      ).join("");

      const famRows = Object.entries(cal.families || {}).slice(0, 12).map(([k, st]) =>
        `<tr><td>${esc(k)}${st.auto_block_warn ? " ⚠" : ""}</td><td>${st.n}</td><td>${fmtPct1(st.mean_pred)}</td><td>${fmtPct1(st.realized)}</td><td>${st.brier?.toFixed(4) ?? "-"}</td><td>${(st.sigma_delta >= 0 ? "+" : "") + st.sigma_delta.toFixed(4)}</td></tr>`
      ).join("");

      box.innerHTML = `
        <div class="card">
          <h3>Olasılık Kalibrasyonu (Çubuk: Gerçekleşen · Sarı Çizgi: Tahmin)</h3>
          ${bandsHtml}
          <div class="muted" style="font-size:0.78rem;margin-top:10px;">Toplam: ${cal.total_matches_settled} maç, ${cal.overall.n} seçim · Brier: ${cal.overall.brier.toFixed(4)}</div>
        </div>
        <div class="card">
          <h3>Kaynak Bazlı Öğrenme & Dinamik Δσ</h3>
          <div class="table-wrap"><table><thead><tr><th>Kaynak</th><th>n</th><th>Tahmin</th><th>Tutan</th><th>Brier</th><th>Δσ</th></tr></thead><tbody>${srcRows}</tbody></table></div>
        </div>
        <div class="card" style="grid-column:1 / -1;">
          <h3>Pazar Ailesi Kalibrasyonu</h3>
          <div class="table-wrap"><table><thead><tr><th>Pazar</th><th>n</th><th>Tahmin</th><th>Tutan</th><th>Brier</th><th>Δσ</th></tr></thead><tbody>${famRows}</tbody></table></div>
        </div>
      `;
    }

    async function loadDay(dateStr) {
      if (ROOT_DATA.latest && ROOT_DATA.latest.date === dateStr) {
        CURRENT_DAY = ROOT_DATA.latest;
      } else {
        const res = await fetch(`./data/${dateStr}.json?v=${Date.now()}`);
        CURRENT_DAY = await res.json();
      }
      renderKPIs();
      populateLeagues();
      renderMatches();
      renderCoupons();
    }

    async function init() {
      try {
        const res = await fetch(`./data/dashboard.json?v=${Date.now()}`);
        ROOT_DATA = await res.json();
        const ds = document.getElementById("dateSelect");
        ds.innerHTML = (ROOT_DATA.dates || []).map((d) => `<option value="${d.date}">${d.date} (${d.summary.global_priced}/${d.summary.real_matches})</option>`).join("");
        if (ROOT_DATA.default_date) ds.value = ROOT_DATA.default_date;
        ds.addEventListener("change", () => loadDay(ds.value));
        await loadDay(ds.value || ROOT_DATA.default_date);
        renderLearning();
      } catch (e) {
        document.getElementById("metaLine").textContent = "Veri yüklenemedi: " + e;
      }
    }

    document.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        ["matches", "coupons", "learning"].forEach((id) =>
          document.getElementById("tab-" + id).classList.toggle("hidden", id !== btn.dataset.tab)
        );
      });
    });
    document.querySelectorAll(".pill").forEach((p) => {
      p.addEventListener("click", () => {
        document.querySelectorAll(".pill").forEach((x) => x.classList.remove("active"));
        p.classList.add("active");
        ACTIVE_FILTER = p.dataset.filter;
        renderMatches();
      });
    });
    document.getElementById("searchBox").addEventListener("input", renderMatches);
    document.getElementById("leagueSelect").addEventListener("change", renderMatches);
    document.getElementById("modalBg").addEventListener("click", (e) => {
      if (e.target.id === "modalBg") e.target.classList.remove("open");
    });

    init();
  </script>
</body>
</html>
